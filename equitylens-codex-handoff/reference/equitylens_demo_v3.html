<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EquityLens V3 · 美股公司研究 Demo</title>
<style>
  :root {
    --bg:#f5f7fb; --panel:#ffffff; --panel-2:#f8fafc; --text:#152033; --muted:#6d7788;
    --line:#e7ebf2; --brand:#1e6b57; --brand-soft:#e8f3ef; --navy:#183153; --good:#15815f;

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.55}
  button,input{font:inherit}
  button{cursor:pointer}
  .app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}

  .demo-badge{font-size:11px;font-weight:700;color:#7b5b11;background:#fff4cc;border:1px solid #ecd888;padding:7px 10px;border-radius:10px}

  .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:22px}

  .grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}

  .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric-card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;transition:.18s ease;position:relative}.metric-card:hover{transform:translateY(-2px);box-shadow:0 9px 23px rgba(24,49,83,.08);border-color:#cad6e2}.metric-name{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.metric-name .help{width:15px;height:15px;border-radius:50%;display:inline-grid;place-items:center;background:#eff2f6;color:#7d8898;font-size:9px}.metric-value{font-size:22px;font-weight:800;color:var(--navy);margin:5px 0 2px}.metric-delta{font-size:11px;color:var(--good)}.metric-delta.flat{color:var(--muted)}.metric-benchmark{font-size:10px;color:#8c96a4;margin-top:9px}

  .chart-card{padding:20px}.chart-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.seg{display:flex;gap:4px;background:#f0f3f7;padding:3px;border-radius:10px}.seg button{border:0;background:transparent;font-size:11px;padding:6px 9px;border-radius:8px;color:var(--muted);font-weight:700}.seg button.active{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(20,36,62,.07)}

  .highlight-shell{padding:20px}.highlight-tabs{display:flex;gap:5px;background:#f0f3f7;padding:3px;border-radius:10px;width:max-content}.highlight-tabs button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:800;color:var(--muted)}.highlight-tabs button.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(22,38,65,.07)}

function ensureDcfState(){const d=v3Research[state.company].valuation.dcf.defaults;if(!state.dcf||state.dcf.company!==state.company)state.dcf={company:state.company,growth:d.growth,margin:d.margin,wacc:d.wacc,terminal:d.terminal}}
function dcfCalc(v,ass){const d=v.dcf,g=ass.growth/100,wacc=ass.wacc/100,tg=ass.terminal/100,targetMargin=ass.margin/100;if(wacc<=tg+.002)return {fair:999,forecast:[],ev:0,equity:0};let rev=d.revenue,prev=rev,pv=0,fcff=0,forecast=[];for(let y=1;y<=5;y++){rev*=1+g;const margin=(d.opMargin/100)+(targetMargin-d.opMargin/100)*(y/5);const ebit=rev*margin;const nopat=ebit*(1-d.tax/100);const da=rev*d.daPct/100;const capex=rev*d.capexPct/100;const dNwc=(rev-prev)*d.nwcPct/100;fcff=nopat+da-capex-dNwc;pv+=fcff/Math.pow(1+wacc,y);forecast.push({y,rev,margin:margin*100,fcff});prev=rev}const tv=fcff*(1+tg)/(wacc-tg),ev=pv+tv/Math.pow(1+wacc,5),equity=ev+d.netCash,fair=equity/d.shares;return {fair,forecast,ev,equity}}
function reverseGrowth(v){const target=v.market;let lo=-5,hi=30;for(let i=0;i<60;i++){const mid=(lo+hi)/2,val=dcfCalc(v,{...state.dcf,growth:mid}).fair;if(val<target)lo=mid;else hi=mid}return (lo+hi)/2}
function valueStatus(market,low,high){if(market<low)return ['低于参考区间','good','安全边际较高'];if(market>high)return ['高于参考区间','warn','安全边际有限'];return ['位于参考区间','blue','估值大体合理']}
function renderValuation(){ensureDcfState();const c=data[state.company],v=v3Research[state.company].valuation,d=v.dcf,base=dcfCalc(v,state.dcf);const low=dcfCalc(v,{...state.dcf,wacc:state.dcf.wacc+.5,terminal:Math.max(.5,state.dcf.terminal-.5)}).fair,high=dcfCalc(v,{...state.dcf,wacc:Math.max(state.dcf.terminal+1,state.dcf.wacc-.5),terminal:state.dcf.terminal+.5}).fair,stat=valueStatus(v.market,low,high),implied=reverseGrowth(v);const svals=v.scenarios.map(x=>({...x,value:dcfCalc(v,{growth:x[1],margin:x[2],wacc:x[3],terminal:x[4]}).fair})); $('#section-valuation').innerHTML=`
<div class="section-head"><div><h2>估值</h2><div class="card-sub beginner-only">估值不是寻找一个“精确目标价”，而是回答：当前价格对应什么假设、合理区间大概在哪里、如果假设变化价格会怎样。</div><div class="card-sub pro-only">Historical / peer multiples + 5Y FCFF DCF + sensitivity + reverse DCF</div></div><span class="pill warn">${v.archetype}</span></div>
<div class="valuation-snapshot card" data-testid="valuation-snapshot"><div class="card-sub">Reference Value Snapshot · Demo 模拟</div><div class="value-band"><div><span class="card-sub">当前价格</span><div class="big-number">$${v.market.toFixed(0)}</div></div><div class="range-number"><span>当前 DCF 参考区间</span><strong>$${Math.round(low)} — $${Math.round(high)}</strong></div><div style="text-align:right"><span class="card-sub">Base DCF</span><div class="big-number">$${Math.round(base.fair)}</div></div></div><div class="valuation-tags"><span>${stat[0]}</span><span>${stat[2]}</span><span>模型可信度：${v.confidence}</span><span>推荐方法：${v.method}</span></div></div>
<div class="grid grid-2" style="margin-top:16px"><div class="card card-pad"><div class="card-title">相对估值：和自己过去比</div><div class="card-sub">便宜/昂贵只是相对于历史盈利倍数，不代表内在价值。</div><div class="relative-grid"><div class="relative-kpi"><span>Current P/E</span><strong>${v.relative.pe}×</strong></div><div class="relative-kpi"><span>P/FCF</span><strong>${v.relative.pfcf}×</strong></div><div class="relative-kpi"><span>FCF Yield</span><strong>${v.relative.fcfYield}%</strong></div><div class="relative-kpi"><span>10Y P/E Percentile</span><strong>${v.relative.percentile}%</strong></div></div><div class="range-track"><div class="range-marker" style="left:${v.relative.percentile}%"></div></div><div class="range-labels"><span>25%：${v.relative.hist25}×</span><span>中位：${v.relative.histMedian}×</span><span>75%：${v.relative.hist75}×</span></div></div><div class="card card-pad"><div class="card-title">同行估值比较</div><div class="card-sub">估值必须同时看增长和现金流质量，不能机械比较 P/E。</div><table class="peer-table"><thead><tr><th>公司</th><th>P/E</th><th>Revenue Growth</th><th>FCF Margin</th></tr></thead><tbody>${v.relative.peers.map(x=>`<tr class="${x[0].startsWith(c.name.split(' ')[0])?'current':''}"><td>${x[0]}</td><td>${x[1]}×</td><td>${x[2]}%</td><td>${x[3]}%</td></tr>`).join('')}</tbody></table><div class="source-row"><span class="source-chip-sm">↗ Price / EPS / FCF · Demo</span></div></div></div>
<div class="card card-pad" style="margin-top:16px" data-testid="dcf-model"><div class="section-head"><div><div class="card-title">5-Year FCFF DCF</div><div class="card-sub">代码计算现金流；LLM 不参与数字计算。默认只开放 4 个最重要的假设。</div></div><span class="pill blue">FCFF DCF</span></div><div class="dcf-layout"><div><div class="dcf-output"><div class="card-sub">当前假设下每股内在价值</div><div class="fair" id="dcfFairValue">$${base.fair.toFixed(0)}</div><div class="delta">市场价 $${v.market.toFixed(0)} · ${base.fair>=v.market?'模型价值高于市场价':'模型价值低于市场价'}</div></div><div class="dcf-sliders"><div class="dcf-control"><label>未来5年收入 CAGR</label><input id="dcfGrowth" data-action="dcf-input" data-key="growth" type="range" min="0" max="20" step="0.5" value="${state.dcf.growth}"><output id="dcfGrowthOut">${state.dcf.growth.toFixed(1)}%</output></div><div class="dcf-control"><label>第5年营业利润率</label><input data-action="dcf-input" data-key="margin" type="range" min="20" max="55" step="0.5" value="${state.dcf.margin}"><output id="dcfMarginOut">${state.dcf.margin.toFixed(1)}%</output></div><div class="dcf-control"><label>WACC 折现率</label><input data-action="dcf-input" data-key="wacc" type="range" min="5" max="12" step="0.25" value="${state.dcf.wacc}"><output id="dcfWaccOut">${state.dcf.wacc.toFixed(2)}%</output></div><div class="dcf-control"><label>永续增长率</label><input data-action="dcf-input" data-key="terminal" type="range" min="1" max="4" step="0.25" value="${state.dcf.terminal}"><output id="dcfTerminalOut">${state.dcf.terminal.toFixed(2)}%</output></div></div><div class="beginner-note"><div>💡</div><div><strong>为什么只给四个滑杆？</strong><p>收入增长决定生意能长多大，利润率决定每 100 元收入能留下多少经营利润，WACC 决定未来现金今天值多少钱，永续增长决定终值。其他技术参数在专业模式展开。</p></div></div></div><div><div class="card-title">5 年现金流预测</div><table class="forecast-table"><thead><tr><th>Year</th><th>Revenue</th><th>Op Margin</th><th>FCFF</th></tr></thead><tbody>${base.forecast.map(x=>`<tr><td>Y${x.y}</td><td>$${x.rev.toFixed(0)}B</td><td>${x.margin.toFixed(1)}%</td><td>$${x.fcff.toFixed(0)}B</td></tr>`).join('')}</tbody></table><div class="pro-only"><div class="card-title" style="margin-top:14px">固定技术假设</div><div class="quality-kpis"><div class="quality-kpi"><span>Tax Rate</span><strong>${d.tax}%</strong></div><div class="quality-kpi"><span>D&A / Revenue</span><strong>${d.daPct}%</strong></div><div class="quality-kpi"><span>CapEx / Revenue</span><strong>${d.capexPct}%</strong></div><div class="quality-kpi"><span>ΔNWC / ΔRevenue</span><strong>${d.nwcPct}%</strong></div></div></div><div class="model-method"><div class="method-step"><strong>1. Revenue</strong>收入按显式增长假设预测</div><div class="method-step"><strong>2. NOPAT</strong>EBIT × (1−税率)</div><div class="method-step"><strong>3. FCFF</strong>NOPAT + D&A − CapEx − ΔNWC</div><div class="method-step"><strong>4. Equity</strong>折现FCFF+终值+净现金−净债务</div></div></div></div></div>
<div class="card card-pad" style="margin-top:16px"><div class="card-title">Scenario Valuation</div><div class="card-sub">不是给一个目标价，而是明确：什么经营世界对应什么价值。</div><div class="scenario-grid-v3" style="margin-top:12px">${svals.map((x,i)=>`<div class="scenario-v3 ${i===1?'base':''}"><h3>${x[0]} Case</h3><div class="value">$${Math.round(x.value)}</div><ul><li>Revenue CAGR ${x[1]}%</li><li>Op Margin ${x[2]}%</li><li>WACC ${x[3]}%</li><li>Terminal ${x[4]}%</li><li>${x[5]}</li></ul></div>`).join('')}</div></div>
<div class="grid grid-2" style="margin-top:16px"><div class="card card-pad" data-testid="sensitivity-matrix"><div class="card-title">Sensitivity Matrix</div><div class="card-sub">固定增长和利润率，观察 WACC × 永续增长变化时估值会有多敏感。</div>${sensitivityHtml(v)}</div><div class="card card-pad" data-testid="reverse-dcf"><div class="card-title">Reverse DCF：当前股价隐含什么？</div><div class="card-sub">不问“公司值多少钱”，反过来问“市场价格要求公司做到什么”。</div><div class="reverse-box" style="margin-top:14px"><div class="reverse-number"><span>市场隐含 5Y Revenue CAGR</span><strong>${implied.toFixed(1)}%</strong><span>在其他当前假设不变时</span></div><div><div class="card-sub">历史近 5 年收入 CAGR（Demo）</div><div style="font-size:24px;font-weight:850;color:var(--navy)">${d.historyCagr}%</div><p style="font-size:11px;color:var(--muted)">市场隐含增长 ${implied>d.historyCagr?'高于':'低于或接近'} 历史水平。真正的投资问题是：你是否有足够证据相信这个隐含预期能够兑现？</p></div></div></div></div>
<div class="beginner-note" style="margin-top:16px"><div>!</div><div><strong>估值页的使用规范</strong><p>参考价格区间只能作为研究输入，不是买卖指令。必须同时展示假设、模型敏感性和模型可信度；业务越不可预测，越不应该相信一个精确的 DCF 数字。</p></div></div>`}
function sensitivityHtml(v){const rows=[state.dcf.wacc-.5,state.dcf.wacc,state.dcf.wacc+.5],cols=[Math.max(1,state.dcf.terminal-.5),state.dcf.terminal,state.dcf.terminal+.5];return `<table class="sensitivity"><thead><tr><th>WACC ↓ / g →</th>${cols.map(x=>`<th>${x.toFixed(2)}%</th>`).join('')}</tr></thead><tbody>${rows.map(w=>`<tr><th>${w.toFixed(2)}%</th>${cols.map(g=>{const val=dcfCalc(v,{...state.dcf,wacc:w,terminal:g}).fair,near=Math.abs(w-state.dcf.wacc)<.01&&Math.abs(g-state.dcf.terminal)<.01;return `<td class="${near?'near':''}">$${Math.round(val)}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}

function renderRisks(){const c=data[state.company]; $('#section-risks').innerHTML=`<div class="section-head"><div><h2>风险清单</h2><div class="card-sub">风险不是列得越多越专业，而是明确“什么事情发生，会让投资逻辑失效”。</div></div><span class="pill warn">需持续跟踪</span></div><div class="grid grid-2"><div class="risk-list">${c.risks.map(r=>`<div class="risk-item"><div class="risk-level ${r[1]}" style="background:var(--${r[1]}-soft);color:var(--${r[1]})">${r[0]}</div><div><h3>${r[2]}</h3><p>${r[3]}</p></div><div class="risk-prob">发生概率：${r[4]}</div></div>`).join('')}</div><div class="card card-pad"><div class="card-title">Thesis Breakers</div><div class="card-sub">未来正式产品里，建议你给每家公司固定维护 3-5 个“逻辑失效条件”。</div><div class="beginner-note"><div>1</div><div><strong>连续两年核心业务增速显著低于行业</strong><p>说明竞争力或市场空间判断可能错了。</p></div></div><div class="beginner-note"><div>2</div><div><strong>ROIC 与自由现金流率持续恶化</strong><p>说明增长可能是靠更多资本堆出来的。</p></div></div><div class="beginner-note"><div>3</div><div><strong>护城河证据被新技术/监管削弱</strong><p>定性变化最终通常会反映到财务指标。</p></div></div></div></div>`}

function renderAI(){const c=data[state.company],a=c.ai[state.aiKey]; $('#section-ai').innerHTML=`<div class="section-head"><div><h2>AI研究助手</h2><div class="card-sub">Demo 展示的是“AI 解释层”：数字来自数据引擎，观点必须带 Evidence。</div></div><span class="pill good">Evidence-first</span></div><div class="ai-layout"><div class="card ai-questions"><h3>试试这些问题</h3>${Object.entries(c.ai).map(([k,v])=>`<button class="question-btn ${state.aiKey===k?'active':''}" data-action="ai-question" data-ai="${k}">${v.q}</button>`).join('')}<button class="question-btn" data-action="ai-question" data-ai="custom">如果收入增长，但自由现金流下降，意味着什么？</button></div><div class="card ai-answer" id="aiAnswer">${aiAnswerHtml(a)}</div></div>`}
function aiAnswerHtml(a){return `<div class="ai-kicker">AI RESEARCHER · 模拟回答</div><h2>${a.title}</h2><p>下面先给结论，再告诉你为什么。真实系统会从结构化财务数据、10-K/10-Q 与电话会议中拉取证据。</p>${a.points.map((p,i)=>`<div class="answer-point"><div class="answer-num">${i+1}</div><div><strong>${p[0]}</strong><span>${p[1]}</span></div></div>`).join('')}<div class="sources">${a.sources.map(s=>`<span class="source-chip">↗ ${s}</span>`).join('')}</div><div class="ai-disclaimer">AI 只负责解释和组织证据；财务数字应由结构化数据与确定性公式计算，不能让大模型“看着财报猜数字”。</div>`}
function customAnswer(){return {title:'“收入增长、自由现金流下降”不是自动的坏事，但必须找出现金去了哪里。',points:[['先看 CapEx','如果是主动增加数据中心、工厂等长期投资，可能是在为未来增长铺路。'],['再看营运资本','应收账款、库存上升也会暂时吃掉现金，需要判断是否异常。'],['最后看持续时间','短期投入可以接受；如果多年收入增长却始终不能转成现金，就要怀疑增长质量。']],sources:['Cash Flow Statement（教学示例）','Balance Sheet（教学示例）']}}

function renderAll(){const c=data[state.company],v=v2Data[state.company]; document.body.classList.toggle('pro',state.mode==='pro'); if(!v.segments.some(s=>s.key===state.segmentKey))state.segmentKey=v.segments[0].key; if(!v.periods.includes(state.period))state.period=v.periods[0]; $('#companyName').textContent=c.name; $('#companyTicker').textContent=c.ticker; $('#industryText').textContent=c.industry; $('#companyDesc').textContent=c.desc; $('#marketCap').textContent=c.cap; $('#priceText').textContent=c.price; $('#priceDelta').textContent=c.delta; $('#qualityPill').textContent=c.quality; renderToolbar(); renderOverview(); renderBusiness(); renderFinancials(); renderMoat(); renderManagement(); renderValuation(); renderRisks(); renderAI(); applyTab(); updateButtons();}
function applyTab(){ $$('.section').forEach(x=>x.classList.remove('active')); const sec=$('#section-'+state.tab); if(sec)sec.classList.add('active'); }
function updateButtons(){ $$('[data-action="company"]').forEach(b=>b.classList.toggle('active',b.dataset.company===state.company)); $$('[data-action="mode"]').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode)); $$('[data-action="tab"]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab)); }
function openMetric(key){const k=metricKnowledge[key]||metricKnowledge.revenue; $('#modalMetricTitle').textContent=`${k.en}`; $('#modalMetricSub').textContent=k.cn; $('#modalBody').innerHTML=`<div class="explain-grid"><div class="explain-box"><h4>它回答什么问题？</h4><p>${k.question}</p></div><div class="explain-box"><h4>定义</h4><p>${k.definition}</p></div></div><div style="margin-top:12px"><div class="card-sub" style="margin-bottom:5px">常见公式</div><div class="formula">${k.formula}</div></div><div class="plain-box"><strong>用人话理解：</strong><br>${k.plain}</div><div class="warning-box"><strong>⚠ 注意：</strong> ${k.warning}</div>`; $('#metricModal').classList.add('open')}

window.addEventListener('click',e=>{const b=e.target.closest('[data-action]'); if(!b)return; const a=b.dataset.action;
  if(a==='company'){state.company=b.dataset.company; state.growth=6; state.dcf=null; const v=v2Data[state.company]; state.segmentKey=v.segments[0].key; state.period=v.periods[0]; renderAll()}
  if(a==='mode'){state.mode=b.dataset.mode; document.body.classList.toggle('pro',state.mode==='pro'); updateButtons()}
  if(a==='tab'){state.tab=b.dataset.tab; applyTab(); updateButtons(); window.scrollTo({top:0,behavior:'smooth'})}
  if(a==='metric'){openMetric(b.dataset.metric)}
  if(a==='close-modal'||e.target.id==='metricModal'){$('#metricModal').classList.remove('open')}
  if(a==='range'){state.range=b.dataset.range; renderOverview(); renderFinancials()}
  if(a==='chart-metric'){state.chartMetric=b.dataset.chartmetric; renderOverview(); if(state.financialView==='annual')renderFinancials()}
  if(a==='segment'){state.segmentKey=b.dataset.segment; renderOverview(); renderBusiness()}
  if(a==='goto-business'){state.tab='business'; applyTab(); updateButtons(); window.scrollTo({top:0,behavior:'smooth'})}
  if(a==='highlight-period'){state.highlightPeriod=b.dataset.highlight; renderOverview()}
  if(a==='quarter-metric'){state.quarterMetric=b.dataset.qmetric; renderOverview(); renderFinancials()}
  if(a==='financial-view'){state.financialView=b.dataset.fview; renderFinancials()}
  if(a==='watch'){state.watched=!state.watched; renderToolbar()}
  if(a==='compare-demo'){b.textContent=b.textContent.includes('Apple')?'＋ 对比公司':(state.company==='AAPL'?'对比 Microsoft':'对比 Apple'); b.classList.toggle('active')}
  if(a==='moat-toggle'){b.closest('.moat-item').classList.toggle('open')}
  if(a==='ai-question'){state.aiKey=b.dataset.ai; $$('.question-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); const ans=state.aiKey==='custom'?customAnswer():data[state.company].ai[state.aiKey]; $('#aiAnswer').innerHTML=aiAnswerHtml(ans)}
});
window.addEventListener('change',e=>{if(e.target.id==='periodSelect'){state.period=e.target.value; renderOverview(); renderToolbar();}});
window.addEventListener('input',e=>{if(e.target.matches('[data-action=\"growth\"]')){state.growth=Number(e.target.value); const g=$('#growthText'),f=$('#dynamicFair'); if(g)g.textContent=state.growth.toFixed(1); if(f)f.textContent='$'+calcFair();} if(e.target.matches('[data-action=\"dcf-input\"]')){ensureDcfState(); state.dcf[e.target.dataset.key]=Number(e.target.value); renderValuation();}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#metricModal').classList.remove('open')});
renderAll();
</script>
</body>
</html>
